    <script>
        // Función para calcular el área y perímetro
        document.getElementById('calculate').addEventListener('click', function() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);

            if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
                alert("Por favor, ingrese valores válidos para el ancho y el alto.");
                return;
            }

            const area = width * height;
            const perimeter = 2 * (width + height);

            document.getElementById('area').textContent = `Área: ${area}`;
            document.getElementById('perimeter').textContent = `Perímetro: ${perimeter}`;
        });
    </script>
